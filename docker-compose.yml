name: hepco-it-command-center

services:
  postgres:
    image: postgres:16-alpine
    container_name: hicc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hicc_db}
      POSTGRES_USER: ${POSTGRES_USER:-hicc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hicc_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hicc_user} -d ${POSTGRES_DB:-hicc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hicc_internal

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: hicc-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - hicc_internal

  scanner:
    build:
      context: .
      dockerfile: deployment/Dockerfile.scanner
    container_name: hicc-scanner
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # Host networking + NET_RAW/NET_ADMIN are required on Linux for Layer-2 ARP discovery
    network_mode: "host"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN

  nginx:
    image: nginx:1.27-alpine
    container_name: hicc-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/hicc.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - hicc_internal

volumes:
  hicc_pgdata:
    name: hicc_postgres_data

networks:
  hicc_internal:
    driver: bridge
